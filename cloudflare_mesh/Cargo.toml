[package]
name = "cloudflare_mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["AVA007 Project"]
description = "Cloudflare mesh — Worker proxy egress + webhook ingress + tunnel"
license = "MIT OR Apache-2.0"

[lib]
name = "cloudflare_mesh"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

anyhow = "1"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
