[package]
name = "lite_notebook"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["AVA007 Project"]
description = "Lite Notebook → Context Ocean deposit loop for AVA007 AMOS"
license = "MIT OR Apache-2.0"

[lib]
name = "lite_notebook"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[features]
default = []
# Enable in-process DuckDB for direct queries without DuckDB-WASM
duckdb-embedded = ["dep:duckdb"]
# NDK target — disables filesystem sync_all (test mode)
ndk-target = []

[dependencies]
# ── Arrow columnar memory ──────────────────────────────────────────
arrow    = { version = "53", default-features = false, features = ["prettyprint"] }
arrow-array    = "53"
arrow-buffer   = "53"
arrow-cast     = "53"
arrow-ipc      = "53"
arrow-schema   = "53"

# ── Parquet (Iceberg data file format) ────────────────────────────
parquet  = { version = "53", default-features = false, features = ["arrow", "zstd"] }

# ── Async runtime ─────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Sync primitives ───────────────────────────────────────────────
parking_lot = "0.12"

# ── Serialization ─────────────────────────────────────────────────
serde       = { version = "1", features = ["derive", "rc"] }
serde_json  = "1"
bincode     = "1.3"

# ── IDs and hashing ───────────────────────────────────────────────
uuid      = { version = "1", features = ["v7", "serde"] }
sha2      = "0.10"
hex       = "0.4"

# ── Time ──────────────────────────────────────────────────────────
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# ── Errors + logging ──────────────────────────────────────────────
anyhow     = "1"
thiserror  = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Optional: in-process DuckDB for direct queries ────────────────
duckdb = { version = "1.1", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "deposit_throughput"
harness = false
