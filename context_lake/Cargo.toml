[package]
name = "context_lake"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["AVA007 Project"]
description = "DuckDB-backed Context Lake implementation for AVA007 Meta Harness"
license = "MIT OR Apache-2.0"

[lib]
name = "context_lake"
path = "src/lib.rs"

[dependencies]
lite_notebook = { path = "../lite_notebook" }
meta_harness = { path = "../meta_harness" }

duckdb = { version = "1.1", features = ["bundled"] }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }

anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
