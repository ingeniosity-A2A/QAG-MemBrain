<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AVA007</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #e8eaf0;
    --surface: #eef0f5;
    --surface-raised: #ffffff;
    --text: #3a3a4a;
    --text-dim: #8a8a9a;
    --yellow: #d4a72c;
    --yellow-soft: rgba(212, 167, 44, 0.12);
    --yellow-sunken: rgba(212, 167, 44, 0.5);
    --green: #4caf50;
    --red: #e64545;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-dark: rgba(163, 177, 198, 0.5);
    --shadow-light: rgba(255, 255, 255, 0.8);
    --neu-raised: -6px -6px 16px var(--shadow-light), 6px 6px 16px var(--shadow-dark);
    --neu-sunken: inset -4px -4px 10px var(--shadow-light), inset 4px 4px 10px var(--shadow-dark);
    --neu-yellow-sunken: inset -2px -2px 6px rgba(255,255,255,0.6), inset 3px 3px 8px var(--yellow-sunken);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .header {
    padding: 14px 20px;
    background: var(--surface);
    border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: var(--neu-raised);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .header-status {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--green);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    background: var(--surface);
    box-shadow: var(--neu-sunken);
  }

  .header-mode-toggle {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    box-shadow: var(--neu-sunken);
  }

  .mode-btn {
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--surface-raised);
    color: var(--yellow);
    box-shadow: -2px -2px 6px var(--shadow-light), 2px 2px 6px var(--shadow-dark);
  }

  /* ===== CHAT AREA ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

  /* ===== CHAT BUBBLES ===== */
  .chat-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.5;
    animation: bubbleIn 0.3s ease;
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-bubble.ava {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--neu-raised);
    border-bottom-left-radius: 4px;
  }

  .chat-bubble.user {
    align-self: flex-end;
    background: var(--yellow-soft);
    color: var(--text);
    box-shadow: var(--neu-yellow-sunken);
    border-bottom-right-radius: 4px;
  }

  .chat-bubble.thinking {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text-dim);
    font-style: italic;
    box-shadow: var(--neu-sunken);
  }

  .chat-bubble.error {
    align-self: flex-start;
    background: rgba(230, 69, 69, 0.1);
    color: var(--red);
    box-shadow: var(--neu-sunken);
  }

  .chat-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ===== QUOTE CARD (Customer Mode) ===== */
  .quote-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--neu-raised);
    margin: 8px 0;
    display: none;
  }

  .quote-card.visible { display: block; }

  .quote-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .quote-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .quote-price {
    font-size: 28px;
    font-weight: 800;
    color: var(--yellow);
  }

  .quote-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .quote-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    box-shadow: var(--neu-sunken);
    font-size: 13px;
  }

  .quote-item-name { color: var(--text); }
  .quote-item-price { color: var(--yellow); font-weight: 600; }

  .quote-actions {
    display: flex;
    gap: 8px;
  }

  .quote-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .quote-btn.accept {
    background: var(--yellow-soft);
    color: var(--yellow);
    box-shadow: var(--neu-yellow-sunken);
  }

  .quote-btn.accept:active {
    box-shadow: var(--neu-sunken);
  }

  .quote-btn.decline {
    background: var(--surface);
    color: var(--text-dim);
    box-shadow: var(--neu-raised);
  }

  .quote-btn.decline:active {
    box-shadow: var(--neu-sunken);
  }

  /* ===== INPUT BAR ===== */
  .input-bar {
    padding: 12px 16px;
    background: var(--surface);
    box-shadow: var(--neu-raised);
    border-radius: var(--radius) var(--radius) 0 0;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }

  .input-field {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    box-shadow: var(--neu-sunken);
    transition: box-shadow 0.2s;
  }

  .input-field::placeholder { color: var(--text-dim); }
  .input-field:focus { box-shadow: var(--neu-yellow-sunken); }

  .send-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--yellow);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--neu-raised);
    transition: all 0.15s;
  }

  .send-btn:active {
    box-shadow: var(--neu-sunken);
    transform: scale(0.95);
  }

  .send-btn:disabled {
    color: var(--text-dim);
    opacity: 0.5;
  }

  /* ===== ADMIN INFO BAR ===== */
  .admin-info {
    display: none;
    padding: 6px 16px;
    background: var(--surface);
    box-shadow: var(--neu-sunken);
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    flex-shrink: 0;
  }

  .admin-info.visible { display: block; }
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">AVA007</div>
      <div class="header-status" id="statusBadge">LIVE</div>
    </div>
    <div class="header-mode-toggle">
      <button class="mode-btn active" onclick="setMode('admin')" id="modeAdmin">Admin</button>
      <button class="mode-btn" onclick="setMode('customer')" id="modeCustomer">Customer</button>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea">
    <div class="chat-bubble ava">
      AVA007 online. Sovereign inference active via Gemma 2B. How can I help?
      <div class="chat-time" id="initTime"></div>
    </div>
  </div>

  <!-- QUOTE CARD (visible only in customer mode) -->
  <div class="quote-card" id="quoteCard">
    <div class="quote-header">
      <div class="quote-title">Service Quote</div>
      <div class="quote-price" id="quotePrice">$0</div>
    </div>
    <div class="quote-items" id="quoteItems"></div>
    <div class="quote-actions">
      <button class="quote-btn accept" onclick="acceptQuote()">Accept</button>
      <button class="quote-btn decline" onclick="declineQuote()">Decline</button>
    </div>
  </div>

  <!-- ADMIN INFO BAR -->
  <div class="admin-info visible" id="adminInfo">
    Model: Gemma 2B | Endpoint: localhost:8080 | Mode: Admin
  </div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <input
      type="text"
      class="input-field"
      id="chatInput"
      placeholder="Message AVA007..."
      autocomplete="off"
      onkeydown="if(event.key==='Enter')sendMessage()"
    >
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>

<script>
  var LLAMA_SERVER = 'http://localhost:8080';
  var currentMode = 'admin';
  var chatArea = document.getElementById('chatArea');
  var chatInput = document.getElementById('chatInput');
  var quoteCard = document.getElementById('quoteCard');
  var adminInfo = document.getElementById('adminInfo');

  // Set initial time
  document.getElementById('initTime').textContent = getTime();

  function getTime() {
    var d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' +
           d.getMinutes().toString().padStart(2,'0');
  }

  function addBubble(text, type) {
    var bubble = document.createElement('div');
    bubble.className = 'chat-bubble ' + type;
    bubble.innerHTML = text + '<div class="chat-time">' + getTime() + '</div>';
    chatArea.appendChild(bubble);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('modeAdmin').classList.toggle('active', mode === 'admin');
    document.getElementById('modeCustomer').classList.toggle('active', mode === 'customer');

    if (mode === 'customer') {
      quoteCard.classList.add('visible');
      adminInfo.classList.remove('visible');
    } else {
      quoteCard.classList.remove('visible');
      adminInfo.classList.add('visible');
    }
  }

  function sendMessage() {
    var text = chatInput.value.trim();
    if (!text) return;

    // Add user bubble
    addBubble(text, 'user');
    chatInput.value = '';

    // Add thinking indicator
    var thinking = document.createElement('div');
    thinking.className = 'chat-bubble thinking';
    thinking.id = 'thinkingBubble';
    thinking.innerHTML = 'AVA007 is thinking...';
    chatArea.appendChild(thinking);
    chatArea.scrollTop = chatArea.scrollHeight;

    // Build system prompt based on mode
    var systemPrompt = currentMode === 'customer'
      ? 'You are AVA007, an AI assistant for Help Assembly, a furniture assembly service. You help customers get quotes and schedule service. Be friendly and concise. If the customer asks for a quote, provide pricing information.'
      : 'You are AVA007, a sovereign AI assistant running on-device on a Samsung S25 Ultra via llama-server with Gemma 2B. You assist with system administration, coding, architecture, and analysis. Be direct and technical.';

    // Call llama-server
    fetch(LLAMA_SERVER + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: text }
        ],
        max_tokens: 512,
        temperature: 0.7
      })
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      document.getElementById('thinkingBubble').remove();
      var reply = data.choices[0].message.content;
      addBubble(reply, 'ava');

      // Update admin info with timing
      if (currentMode === 'admin' && data.timings) {
        var tps = data.timings.predicted_per_second || 0;
        var ms = data.timings.predicted_ms || 0;
        adminInfo.textContent = 'Model: Gemma 2B | ' + tps.toFixed(1) + ' tok/s | ' + Math.round(ms) + 'ms | Endpoint: localhost:8080';
      }

      // In customer mode, if response looks like a quote, show the quote card
      if (currentMode === 'customer') {
        tryShowQuote(reply);
      }
    })
    .catch(function(err) {
      var t = document.getElementById('thinkingBubble');
      if (t) t.remove();
      addBubble('Error: ' + err.message + '<br><br>Is llama-server running?<br>Run: <code>llama-server -m ~/gemma-2b.gguf --port 8080</code>', 'error');
    });
  }

  function tryShowQuote(response) {
    // Simple heuristic: if response contains $ amount, show quote card
    var priceMatch = response.match(/\$(\d+)/);
    if (priceMatch) {
      document.getElementById('quotePrice').textContent = '$' + priceMatch[1];
      var items = document.getElementById('quoteItems');
      items.innerHTML = '';
      var item = document.createElement('div');
      item.className = 'quote-item';
      item.innerHTML = '<span class="quote-item-name">Assembly Service</span><span class="quote-item-price">$' + priceMatch[1] + '</span>';
      items.appendChild(item);
      quoteCard.classList.add('visible');
    }
  }

  function acceptQuote() {
    addBubble('Quote accepted! We will dispatch a technician shortly.', 'ava');
    quoteCard.classList.remove('visible');
  }

  function declineQuote() {
    quoteCard.classList.remove('visible');
  }

  // Focus input on load
  chatInput.focus();
</script>
</body>
</html>
