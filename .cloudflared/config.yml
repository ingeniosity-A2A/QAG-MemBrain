# QAG-MemBrain Cloudflare Tunnel Configuration
#
# This tunnel exposes the MemBrain WS server to the internet.
# Two ways to run:
#
# 1. NAMED TUNNEL (recommended for production):
#    cloudflared tunnel run --token <CLOUDFLARE_TUNNEL_TOKEN>
#    The cfat_ token from your Cloudflare dashboard goes here.
#
# 2. QUICK TUNNEL (for testing, no account needed):
#    cloudflared tunnel --url http://localhost:3000
#    Gets a random trycloudflare.com subdomain.

tunnel: qag-membrain
credentials-file: /home/z/my-project/.cloudflared/credentials.json

ingress:
  # WebSocket + HTTP main server
  - hostname: membrain.ingeniosity.tech
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true

  # Telnyx webhook endpoint (same server, different path)
  - hostname: membrain.ingeniosity.tech
    path: /telnyx/webhook
    service: http://localhost:3000

  # Health check fallback
  - service: http_status:404
