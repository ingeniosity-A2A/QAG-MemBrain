<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ava Surface - Opera Air</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e0e0e0;
      --accent: #6c5ce7;
      --accent2: #00cec9;
      --font-mono: 'SF Mono', 'Fira Code', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header__title { font-size: 14px; font-weight: 600; }
    .header__status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
    }
    .header__dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .header__dot.connected { background: var(--accent2); }
    .split-flap {
      display: flex;
      gap: 2px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .split-flap__cell {
      width: 24px; height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .msg--agent { flex-direction: row; }
    .msg--user { flex-direction: row-reverse; }
    .msg__avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .msg--agent .msg__avatar { background: var(--accent); color: #fff; }
    .msg--user .msg__avatar { background: var(--accent2); color: #000; }
    .msg__bubble {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .msg--user .msg__bubble { background: rgba(108,92,231,0.1); border-color: rgba(108,92,231,0.2); }
    .social-bar {
      display: flex;
      gap: 12px;
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .social-bar__channel {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #888;
    }
    .social-bar__dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent2);
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
    }
    .input-area__field {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
    }
    .input-area__field:focus { border-color: var(--accent); }
    .input-area__submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-area__submit:disabled { opacity: 0.4; cursor: default; }
    .input-area__submit:hover:not(:disabled) { opacity: 0.9; }
    .jsonl-ticker {
      font-size: 10px;
      color: #555;
      padding: 4px 20px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header__title">QAG MemBrain - Opera Air</div>
    <div class="header__status">
      <div class="header__dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="split-flap" id="splitFlap"></div>

  <div class="chat-area" id="chatLog"></div>

  <div class="social-bar">
    <div class="social-bar__channel"><div class="social-bar__dot"></div>beeper</div>
    <div class="social-bar__channel"><div class="social-bar__dot"></div>a2a</div>
    <div class="social-bar__channel"><div class="social-bar__dot"></div>nfc</div>
    <div class="social-bar__channel"><div class="social-bar__dot"></div>lora</div>
  </div>

  <div class="jsonl-ticker" id="jsonlTicker">seq: 0</div>

  <div class="input-area">
    <input
      type="text"
      class="input-area__field"
      id="promptInput"
      placeholder="Enter prompt..."
      aria-label="Prompt input"
    />
    <button class="input-area__submit" id="submitBtn" onclick="sendPrompt()">Send</button>
  </div>

  <script>
    // ─── WebSocket connection ──────────────────────────────────────
    const WS_URL = (typeof MEMBRAIN_WS !== 'undefined')
      ? MEMBRAIN_WS
      : 'ws://localhost:8080/timeline';

    let ws = null;
    let seq = 0;

    function connectWS() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = 'Connected';
        document.getElementById('submitBtn').disabled = false;
      };
      ws.onclose = () => {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').textContent = 'Disconnected';
        document.getElementById('submitBtn').disabled = true;
        setTimeout(connectWS, 3000);
      };
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'decision' && data.data) {
            appendMessage('agent', data.data.rationale || data.data.action);
            seq++;
            updateTicker();
          }
          if (data.type === 'timeline_snapshot' && data.entries) {
            seq = data.entries.length;
            updateTicker();
          }
        } catch {}
      };
    }

    // ─── Chat rendering ────────────────────────────────────────────
    function appendMessage(role, content) {
      const log = document.getElementById('chatLog');
      const div = document.createElement('div');
      div.className = `msg msg--${role}`;
      const label = role === 'user' ? 'U' : 'AV';
      div.innerHTML = `
        <div class="msg__avatar">${label}</div>
        <div class="msg__bubble">${escapeHtml(content)}</div>
      `;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // ─── Prompt sending ────────────────────────────────────────────
    function sendPrompt() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      appendMessage('user', text);
      ws.send(JSON.stringify(text));
      input.value = '';
      input.focus();
    }

    document.getElementById('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendPrompt();
    });

    // ─── Split-flap display ────────────────────────────────────────
    function updateSplitFlap(text) {
      const container = document.getElementById('splitFlap');
      const padded = text.toUpperCase().padEnd(30, ' ').slice(0, 30);
      container.innerHTML = padded.split('').map(ch =>
        `<div class="split-flap__cell">${ch}</div>`
      ).join('');
    }

    // ─── JSONL ticker ──────────────────────────────────────────────
    function updateTicker() {
      document.getElementById('jsonlTicker').textContent = `seq: ${seq}`;
      updateSplitFlap(`MEMBRAIN  SEQ ${String(seq).padStart(6, '0')}`);
    }

    // ─── Init ──────────────────────────────────────────────────────
    updateTicker();
    connectWS();
  </script>
</body>
</html>
