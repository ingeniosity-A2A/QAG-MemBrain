[package]
name = "qnn-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QNN (Qualcomm Neural Network) NPU bridge for AMOS Mobile Runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Enable when the QNN SDK is installed and qnn-sys crate is wired up.
qnn_sdk = []
