[package]
name = "arrow-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apache Arrow zero-copy bridge for AMOS Mobile Runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Enable when the `arrow` crate is added (e.g. `arrow = "52"`).
arrow = []
