syntax = "proto3";

package qag.membrain.tashi.v1;

import "google/protobuf/struct.proto";

message Vertex {
  string hash = 1;
  repeated string parent_hashes = 2;
  string creator_did = 3;
  string signature = 4;
  int64 timestamp_ms = 5;

  // Optional linkage to atomic memory ledger artifacts.
  string atom_id = 6;
  string atom_hash = 7;

  // Canonical signed payload body.
  google.protobuf.Struct payload = 8;
}