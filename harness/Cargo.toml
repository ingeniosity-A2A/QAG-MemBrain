[package]
name = "harness"
version = "0.1.0"
edition = "2021"
description = "Harness registry — execution substrates that Skills deploy to"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
