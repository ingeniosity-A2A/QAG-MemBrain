[package]
name = "mobile_runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["AVA007 Project"]
description = "AVA007 Mobile Runtime — bootstrap that wires Context Ocean + DuckDB Lake + Goose + Meta Harness + Thermal"
license = "MIT OR Apache-2.0"

[lib]
name = "mobile_runtime"
path = "src/lib.rs"

[dependencies]
lite_notebook = { path = "../lite_notebook" }
meta_harness = { path = "../meta_harness" }
context_lake = { path = "../context_lake" }
goose = { path = "../goose" }

tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
