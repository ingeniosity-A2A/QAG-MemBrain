[package]
name = "capabilities"
version = "0.1.0"
edition = "2021"
description = "WASM-native Capabilities IR — evolvable capability sandboxes (white paper §5)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio-test = "0.4"
