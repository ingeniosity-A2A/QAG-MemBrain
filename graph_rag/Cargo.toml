[package]
name = "graph_rag"
version = "0.1.0"
edition = "2021"
description = "L4 — Neo4j GraphRAG for deep context retrieval (white paper §3, L4 layer)"
license = "MIT OR Apache-2.0"

[dependencies]
lite_notebook = { path = "../lite_notebook" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
