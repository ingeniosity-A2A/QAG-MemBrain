[workspace]
resolver = "2"
members = [
    "lite_notebook",
    "meta_harness",
    "context_lake",
    "goose",
    "mobile_runtime",
    "telnyx",
    "cloudflare_mesh",
    "harness_evolution",
    "constellation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["AVA007 Project"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Sync
parking_lot = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs / hashing
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
hex = "0.4"

# Errors + logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Arrow / Parquet
arrow = { version = "53", default-features = false, features = ["prettyprint"] }
parquet = { version = "53", default-features = false, features = ["arrow", "zstd"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database
duckdb = { version = "1.1", features = ["bundled"] }

# Misc
lru = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
