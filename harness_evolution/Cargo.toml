[package]
name = "harness_evolution"
version = "0.1.0"
edition = "2021"
description = "Self-evolving harness — HarnessX-inspired overnight processor evolution for AVA007 AMOS"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Hashing / UUID
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Internal crates
lite_notebook = { path = "../lite_notebook" }
meta_harness = { path = "../meta_harness" }
context_lake = { path = "../context_lake" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
